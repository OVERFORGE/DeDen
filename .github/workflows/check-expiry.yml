name: Booking expiry check

# Triggers app/api/bookings/check-expiry, which processes PENDING bookings
# past their expiresAt (sends expiry emails, releases held slots). The app
# also settles staleness lazily on read (lib/booking-lifecycle.ts), so this
# isn't load-bearing for correctness — it just catches bookings nobody
# happens to poll, and keeps expiry emails timely. No Vercel Cron on the
# current plan, so this is the free alternative.
#
# Requires two repo secrets to be set before this does anything:
#   APP_URL     — e.g. https://deden.space
#   JOB_SECRET  — must match the JOB_SECRET env var configured on the app

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-expiry endpoint
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.JOB_SECRET }}" ]; then
            echo "::error::APP_URL or JOB_SECRET repo secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${{ secrets.APP_URL }}/api/bookings/check-expiry" \
            -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat /tmp/response.txt

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
